[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "radioskysims-sources"
version = "0.1.0"
description = "Fontes de sinal do RadioSkySim: satélites GNSS, fontes locais (Sol), fontes de rádio, cosmologia e catálogos."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
authors = [
  { name = "Luciano Barosi", email = "lbarosi@df.ufcg.edu.br" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.3",
  "astropy>=7.1",
  "xarray>=2022.3.1",
  "pandas>=2.2",
  "pydantic>=2",
  "httpx>=0.28",
  "sgp4>=2.24",
  "dask>=2025.5.1",
  "pyccl>=3.0.0",
  "camb>=2.0.0",
  "healpy>=1.17",
  "astroquery>=0.4.7",
  "pyvo>=1.7",
  "georinex>=1.16.0",
  "h5py>=3.10",
  "radioskysims-core",
  "radioskysims-skymap",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/barosil/RadioSkySim"
"Bug Tracker" = "https://github.com/barosil/RadioSkySim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/radioskysims_sources"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]
testpaths = ["tests"]
